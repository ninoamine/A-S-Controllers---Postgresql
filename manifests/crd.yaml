apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: postgresqldatabases.ninoamine.com
spec:
  group: ninoamine.com
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                dbName:
                  type: string
      subresources:
        status: {}
  scope: Namespaced
  names:
    kind: PostgreSQLDatabase
    plural: postgresqldatabases
    singular: postgresqldatabase
    shortNames:
      - pgdb
